{# Shared top bar, included by every page. Set `page` to "advisor", "dashboard", "match", "simulate" or "tagger" before including. #}
<div class="topbar">
  <a class="logo" href="{{ url_for('dashboard.advisor', unit=unit) }}" aria-label="Right-Fit Homes home">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#1f4a37"/>
      <path d="M7.5 15.6 16 8.8l8.5 6.8V24.5h-17z" fill="none" stroke="#f6f1e6" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M12.4 18.9l2.6 2.6 4.8-5.1" fill="none" stroke="#e6936d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Right-Fit Homes</span>
  </a>
  <nav class="page-nav" aria-label="Pages">
    <a href="{{ url_for('dashboard.advisor', unit=unit) }}" {% if page == 'advisor' %}aria-current="page"{% endif %}>Buyer advisor</a>
    <a href="{{ url_for('dashboard.dashboard', unit=unit) }}" {% if page == 'dashboard' %}aria-current="page"{% endif %}>SDP dashboard</a>
    <a href="{{ url_for('dashboard.match', unit=unit) }}" {% if page == 'match' %}aria-current="page"{% endif %}>Neighbour Match</a>
    <a href="{{ url_for('dashboard.simulate', unit=unit) }}" {% if page == 'simulate' %}aria-current="page"{% endif %}>What-if</a>
    <a href="{{ url_for('dashboard.tagger_page', unit=unit) }}" {% if page == 'tagger' %}aria-current="page"{% endif %}>AI tagging</a>
  </nav>
</div>
