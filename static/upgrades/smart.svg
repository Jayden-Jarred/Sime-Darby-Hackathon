    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0d2" stop-opacity=".9"/><stop offset="1" stop-color="#fff0d2" stop-opacity="0"/></linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ddff" stop-opacity=".85"/><stop offset="1" stop-color="#c9ddff" stop-opacity="0"/></linearGradient>
    <linearGradient id="track" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc677"/><stop offset="1" stop-color="#c9ddff"/></linearGradient>
  </defs>
  <rect width="160" height="100" fill="#efe8dc"/>
