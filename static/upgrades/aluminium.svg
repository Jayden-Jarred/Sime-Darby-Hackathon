  <rect x="89.5" y="31.5" width="12" height="1.4" rx=".7" fill="#25282b"/>
  <rect x="122" y="31.5" width="12" height="1.4" rx=".7" fill="#25282b"/>
  <!-- worktop -->
  <rect x="10" y="49" width="140" height="3.4" fill="#d9d4cb"/>
  <rect x="10" y="52.4" width="140" height="1.2" fill="#c3bcb1"/>
  <!-- base units -->
  <rect x="14" y="53.6" width="134" height="30.4" fill="url(#metal)"/>
  <rect x="14" y="53.6" width="134" height="30.4" fill="url(#brush)"/>
  <path d="M46.5 53.6v30.4M79 53.6v30.4M111.5 53.6v30.4M14 63.8h32.5M14 73.9h32.5" stroke="#88929a" stroke-width=".9"/>
  <rect x="24" y="56.5" width="12" height="1.4" rx=".7" fill="#25282b"/>
  <rect x="24" y="66.6" width="12" height="1.4" rx=".7" fill="#25282b"/>
