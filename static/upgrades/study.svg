<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <!-- Wardrobe with study desk: a smaller wardrobe plus a built-in desk and shelf. Illustration, not a product photo. -->
  <rect width="160" height="100" fill="#f2ece2"/>
  <rect y="90" width="160" height="10" fill="#e2d9c9"/>
  <!-- wardrobe -->
  <rect x="10" y="4" width="62" height="86" fill="#f4f0e9"/>
  <path d="M41 4v86" stroke="#d6cdbf" stroke-width="1"/>
  <rect x="10" y="4" width="62" height="2" fill="#d9cfbf"/>
  <rect x="37" y="40" width="1.6" height="12" rx=".8" fill="#8a7f71"/>
  <rect x="43.5" y="40" width="1.6" height="12" rx=".8" fill="#8a7f71"/>
  <!-- shelf with books -->
  <rect x="74" y="28" width="76" height="2.4" fill="#cfae7f"/>
  <g>
    <rect x="80" y="15" width="4" height="13" fill="#5f7d6b"/><rect x="84.5" y="17" width="3.5" height="11" fill="#b65f4a"/>
    <rect x="88.5" y="14" width="4" height="14" fill="#3f4a5c"/><rect x="93" y="18" width="3" height="10" fill="#d9b25e"/>
    <path d="M98 28l6-12 3 1.5-6 10.5z" fill="#7f9bb0"/>
    <rect x="128" y="20" width="12" height="8" rx="4" fill="#6d8f74"/><path d="M134 20c-3-6 1-9 4-9-1 4-2 6-4 9z" fill="#5a7a5f"/>
  </g>
  <!-- desk -->
  <rect x="72" y="58" width="78" height="3" fill="#cfae7f"/>
  <rect x="146" y="61" width="4" height="29" fill="#c09d6c"/>
  <rect x="72" y="61" width="24" height="10" fill="#d9bd92"/><rect x="81" y="65" width="7" height="1.5" rx=".7" fill="#6b5a45"/>
  <!-- lamp and laptop -->
  <path d="M136 58v-14l-6-6" stroke="#2f3336" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M124 40l8-5 3 5z" fill="#2f3336"/>
  <path d="M104 57l3-12h22l-3 12z" fill="#4a5058"/><path d="M106 45.5l2.6-.5h19l-.5 1z" fill="#8fb0c7"/>
  <rect x="100" y="56.6" width="30" height="1.4" rx=".7" fill="#3a3f45"/>
  <!-- chair -->
  <rect x="104" y="62" width="22" height="16" rx="5" fill="#9aa59b"/>
  <rect x="106" y="76" width="18" height="4" rx="2" fill="#7f8a80"/>
  <path d="M115 80v8M108 89h14" stroke="#4a4f53" stroke-width="2" stroke-linecap="round"/>
</svg>
